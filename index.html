<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas | Bienestar Psicológico</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A235A;      /* Morado oscuro y profundo */
            --secondary-color: #8E44AD;     /* Morado vibrante (amatista) */
            --accent-color: #D7BDE2;        /* Lavanda claro */
            --background-color: #f9f7fc;    /* Fondo muy claro con un toque violáceo */
            --text-color-dark: #2C3E50;     /* Texto principal oscuro (azul pizarra) */
            --text-color-light: #f1f1f1;    /* Texto claro sobre fondos oscuros */
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color-dark);
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        header h1 {
            font-family: 'Lora', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-color-light);
            font-weight: 300;
        }

        .calendar-wrapper {
            flex: 1;
            padding: 1rem;
            margin: 1.5rem auto;
            width: 98%;
            max-width: 1600px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(74, 35, 90, 0.1); /* Sombra basada en el morado primario */
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .calendar-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        iframe {
            width: 100%;
            height: calc(100vh - 200px); 
            border: none;
            border-radius: 8px;
        }

        footer {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: var(--text-color-light);
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }

        footer p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* --- Estilos para el Sweet Alert personalizado --- */
        .swal2-popup.custom-swal-popup {
            border-radius: 15px !important;
            border-top: 5px solid var(--primary-color);
        }

        .swal2-title.custom-swal-title {
            font-family: 'Lora', serif;
            color: var(--primary-color);
        }

        .custom-swal-html {
            text-align: left;
            padding: 10px;
            font-size: 1em;
            color: #4a4a4a;
        }

        .custom-swal-html .info-list {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
        }

        .custom-swal-html .info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: rgba(142, 68, 173, 0.05); /* Fondo basado en morado secundario */
            border: 1px solid rgba(142, 68, 173, 0.2);
        }
        
        .custom-swal-html .info-item svg {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            margin-top: 2px;
            color: var(--secondary-color);
        }

        .custom-swal-html .info-item p {
            margin: 0;
            line-height: 1.6;
        }
        
        .custom-swal-html strong {
            font-weight: 500;
            color: var(--primary-color);
        }

        .swal2-confirm.custom-confirm-button {
            background-color: var(--secondary-color) !important;
            border-radius: 8px !important;
            padding: 12px 25px !important;
            font-size: 1em !important;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3) !important;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 { font-size: 1.5rem; }
            header p { font-size: 0.9rem; }
            .calendar-wrapper { padding: 0.5rem; margin: 1rem auto; }
            iframe { height: calc(100vh - 180px); }
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda de Citas | Bienestar Psicológico</h1>
            <p>Tu espacio seguro para el crecimiento personal</p>
        </header>

        <main class="calendar-wrapper">
            <iframe src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3ahnfcdNYuMj3IykB2F9-8mD6vjjhU8XtY6qJ1IYUn8bfdnESPq3M_wqEgu-14e4E22qnzxT7-"></iframe>
        </main>

        <footer>
            <p>© 2024 Bienestar Psicológico. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Swal.fire({
                title: '¡Información Importante!',
                html: `
                    <div class="custom-swal-html">
                        <p>Antes de agendar, por favor ten en cuenta lo siguiente:</p>
                        <ul class="info-list">
                            <li class="info-item">
                                <!-- Ícono de reloj -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586V7z"></path></svg>
                                <p>El <strong>horario de atención</strong> disponible en el calendario es de 8:00 AM a 1:00 PM y de 5:00 PM a 9:00 PM.</p>
                            </li>
                            <li class="info-item">
                                <!-- Ícono de email -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20,4H4C2.897,4,2,4.897,2,6v12c0,1.103,0.897,2,2,2h16c1.103,0,2-0.897,2-2V6C22,4.897,21.103,4,20,4z M19.436,6 12,11.693 4.564,6H19.436z M4,18V7.307l8,5.693l8-5.693V18H4z"></path></svg>
                                <p>Recibirás la <strong>confirmación en tu correo</strong>. Es indispensable que muestres este correo a la psicóloga al momento de tu consulta.</p>
                            </li>
                        </ul>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'Entendido, ver agenda',
                width: 'clamp(350px, 90%, 700px)',
                showCloseButton: true,
                allowOutsideClick: false,
                customClass: {
                    popup: 'custom-swal-popup',
                    title: 'custom-swal-title',
                    confirmButton: 'custom-confirm-button',
                }
            });
        });
    </script>
</body>
</html>
