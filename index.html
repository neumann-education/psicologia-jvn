<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aviso Importante | Bienestar Psicológico</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif; /* Consistent font */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); /* Calming, airy cyan gradient */
            background-size: 200% 200%; /* Important for gradient animation */
            animation: gradientAnimation 15s ease infinite alternate;
            overflow: hidden; /* Prevents scrollbars if alert is too big for viewport briefly */
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Using the custom classes specified in Swal.fire({}) */
        .psych-popup {
            background: #ffffff;
            border-radius: 24px; /* Softer, more modern rounding */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), 0 10px 15px rgba(0,0,0,0.05); /* Softer, more layered shadow */
            padding: 40px 45px;
            max-width: 680px;
            width: 90%;
            animation: fadeInScale 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); /* Smoother easing */
            border-top: 4px solid #3f51b5; /* Accent color border */
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(20px) scale(0.98); } /* Slightly different entry */
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .psych-title {
            font-family: 'Lora', serif;
            font-size: 2.6em !important; /* Slightly adjusted for balance */
            color: #2c3e50 !important; /* Deep, elegant slate blue */
            margin-bottom: 20px !important; /* Adjusted spacing */
            text-align: center;
            line-height: 1.3;
            font-weight: 700;
            text-shadow: 0 1px 1px rgba(0,0,0,0.05); /* Subtle depth */
        }

        .psych-html-container {
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em !important; /* Comfortable reading size */
            color: #555e68; /* Softer grey for text */
            line-height: 1.75;
            margin-bottom: 0 !important;
            text-align: center;
            font-weight: 400; /* Regular weight for body */
        }

        .psych-html-container p {
            margin-bottom: 1.2em;
        }

        .psych-html-container p:last-child {
            margin-bottom: 0;
        }

        .psych-html-container strong {
            font-weight: 500; /* Medium weight for general emphasis */
            color: #3f51b5; /* Consistent emphasis color (original title blue) */
        }

        .psych-html-container .highlight-date {
            font-weight: 700; /* Bold for the date */
            color: #D81B60; /* Vibrant, distinct pink for the date */
            font-size: 1.1em; /* Slightly larger to stand out */
            padding: 2px 4px;
            background-color: rgba(216, 27, 96, 0.05); /* Very subtle background highlight */
            border-radius: 4px;
        }

        .swal2-icon.swal2-info { /* Targeting info icon specifically */
            color: #3f51b5 !important; /* Main accent blue */
            border-color: #a1c4fd !important; /* Lighter border for the icon */
            margin-top: 5px !important; /* Ensure some space from top of popup */
            margin-bottom: 25px !important; /* Good spacing below icon */
            width: 70px !important; /* Adjusted size */
            height: 70px !important;
        }

        /* Ensure the confirm button remains hidden as per original request */
        .swal2-confirm.swal2-styled {
            display: none !important;
        }
    </style>
</head>
<body>
    <script>
        Swal.fire({
            title: 'Un Mensaje Importante para Ti',
            html: `
                <p>Estimada <strong>comunidad estudiantil</strong>, queremos informarte que la reserva de horas para el servicio de <strong>atención psicológica</strong> aún <strong class="highlight-date">no estará dispomible</strong>.</p>
                <p>Estamos comprometidos con tu bienestar y crecimiento personal. ¡Agradecemos tu paciencia y comprensión!</p>
            `, // Corrected strong tags and added class to date
            icon: 'info',
            showConfirmButton: false,
            allowOutsideClick: true,
            allowEscapeKey: true,
            buttonsStyling: false,
            customClass: {
                popup: 'psych-popup',
                title: 'psych-title',
                htmlContainer: 'psych-html-container',
                // icon: 'psych-icon' // you can also customize the icon class if needed
            }
        });
    </script>
</body>
</html>
