<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas | Bienestar Psicológico</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4A235A;      /* Morado oscuro y profundo */
            --secondary-color: #6C3483;    /* Morado intermedio */
            --accent-color: #D5DBDB;       /* Un gris muy claro para bordes sutiles */
            --background-color: #F8F9F9;   /* Fondo general muy claro */
            --text-color-dark: #2C3E50;     /* Texto principal (azul pizarra) */
            --text-color-light: #FFFFFF;    /* Texto claro (blanco) */
            --white: #FFFFFF;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color-dark);
            line-height: 1.7;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        /* --- Header --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-color-light);
            padding: 3rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.9s ease-out;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.25);
        }

        header p {
            font-size: 1.15rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* --- Main Content --- */
        .calendar-wrapper {
            flex: 1;
            padding: 1rem;
            margin: 2rem auto;
            width: 95%;
            max-width: 1500px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }
        
        iframe {
            width: 100%;
            height: calc(100vh - 280px);
            min-height: 550px;
            border: none;
            border-radius: 8px;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--white);
            color: var(--secondary-color);
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid #EAEDED;
        }

        footer p {
            font-size: 0.9rem;
        }

        /* --- Estilos para el Sweet Alert --- */
        .swal2-popup.custom-swal {
            border-radius: 20px !important;
            border: none;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1) !important;
        }

        .swal2-title.custom-swal-title {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            font-size: 1.8rem;
            padding-top: 20px;
        }
        
        .swal2-icon.swal2-info {
            color: var(--secondary-color) !important;
            border-color: var(--secondary-color) !important;
        }

        /* --- NUEVO DISEÑO PARA EL COMUNICADO --- */
        .swal2-html-container.announcement-html {
            text-align: left;
            padding: 5px 25px;
            margin: 20px 0 !important;
            font-size: 1rem;
            color: #555;
        }

        .announcement-html .date-highlight {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
            padding: 20px;
            background-color: #f1eaf5; /* Un tono lila muy claro */
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
        }

        .announcement-html .date-highlight svg {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            color: var(--primary-color);
        }
        
        .announcement-html .date-highlight-text {
            line-height: 1.4;
        }

        .announcement-html .date-highlight-text span {
            font-size: 0.95rem;
            color: var(--text-color-dark);
        }

        .announcement-html .date-highlight-text strong {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary-color);
            font-weight: 700;
        }
        
        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            header { padding: 2.5rem 1rem; }
            header h1 { font-size: 2.2rem; }
            header p { font-size: 1.1rem; }
            .calendar-wrapper { padding: 0.5rem; margin: 1.5rem auto; }
            iframe { height: calc(100vh - 240px); }
        }
        
        @media (max-width: 480px) {
            header h1 { font-size: 1.9rem; }
            header p { font-size: 1rem; }
            .announcement-html .date-highlight { flex-direction: column; text-align: center; gap: 10px; }
        }

        /* --- Keyframe Animations --- */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda de Citas | Bienestar Psicológico</h1>
            <p>Tu espacio seguro para el crecimiento personal</p>
        </header>

        <main class="calendar-wrapper">
            <iframe src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3ahnfcdNYuMj3IykB2F9-8mD6vjjhU8XtY6qJ1IYUn8bfdnESPq3M_wqEgu-14e4E22qnzxT7-"></iframe>
        </main>

        <footer>
            <p>© 2024 Bienestar Psicológico. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Swal.fire({
                title: 'Aviso Importante',
                icon: 'info',
                html: `
                    <div class="announcement-html">
                        <p>La <strong>Oficina de Servicios al Estudiante (OSE)</strong> informa que el sistema de agendamiento de citas para psicología se encuentra temporalmente en pausa.</p>
                        
                        <div class="date-highlight">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <div class="date-highlight-text">
                                <span>El servicio se reanudará el:</span>
                                <strong>Lunes, 8 de Septiembre</strong>
                            </div>
                        </div>

                        <p>Agradecemos de antemano su comprensión.</p>
                    </div>
                `,
                // --- Opciones clave para bloquear la interacción ---
                allowOutsideClick: false, // Evita que se cierre al hacer clic fuera
                allowEscapeKey: false,    // Evita que se cierre con la tecla Esc
                showConfirmButton: false, // Oculta cualquier botón de acción
                showCloseButton: false,   // Oculta el botón de cerrar en la esquina
                
                width: 'clamp(380px, 90%, 650px)',
                customClass: {
                    popup: 'custom-swal',
                    title: 'custom-swal-title',
                    htmlContainer: 'announcement-html',
                }
            });
        });
    </script>
</body>
</html>
